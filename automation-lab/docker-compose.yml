services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    container_name: automation-lab-backend
    volumes:
      - ./backend:/app
      - ./assets:/app/assets
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  react:
    build: 
      context: ./frontend-react
    ports:
      - "3000:3000"
    container_name: automation-lab-react
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend-react:/app
      - /app/node_modules

  angular:
    build: 
      context: ./frontend-angular
    ports:
      - "4200:80"
    container_name: automation-lab-angular
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000

  svelte:
    build: 
      context: ./frontend-svelte
    ports:
      - "5173:5173"
    container_name: automation-lab-svelte
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend-svelte:/app
      - /app/node_modules

  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    container_name: automation-lab-vision
    volumes:
      - ./vision-service:/app
      - /app/__pycache__
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s