[pytest]
testpaths = tests
junit_family = xunit1
junit_logging = system-out
markers =
    base: Tests that use the base locator strategy CSS selectors
    getby: Tests based on semantic selectors and get_by methods
    getby_full: Full post-login E2E flow using semantic get_by locators (1:1 comparison with opencv_full)
    opencv: Tests that use the OpenVisor computer vision strategy
    opencv_full: Full post-login E2E flow using OpenVisor computer vision and adaptive OCR
    external: Tests on external live e-commerce websites
filterwarnings =
    ignore::pytest.PytestExperimentalApiWarning
addopts =
    -v
    --capture=tee-sys
    -p no:html
    --junitxml=reports/report.xml
